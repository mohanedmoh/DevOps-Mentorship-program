name: validate

on:
  push:
    branches: [main, upgrade]
  pull_request:

permissions:
  contents: read

jobs:
  roots:
    name: find roots
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          dirs=$(find . -name versions.tf -not -path '*/.terraform/*' -not -path '*/modules/*' -printf '%h\n' | sed 's|^\./||' | sort | jq -R . | jq -sc .)
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "$dirs"

  terraform:
    name: terraform ${{ matrix.dir }}
    needs: roots
    if: needs.roots.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.roots.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - name: Format
        run: bash "$GITHUB_WORKSPACE/.github/scripts/annotate.sh" "fmt ${{ matrix.dir }}" terraform fmt -check -diff -recursive -no-color
        working-directory: ${{ matrix.dir }}
      - name: Init
        run: bash "$GITHUB_WORKSPACE/.github/scripts/annotate.sh" "init ${{ matrix.dir }}" terraform init -backend=false -input=false -no-color
        working-directory: ${{ matrix.dir }}
      - name: Validate
        run: bash "$GITHUB_WORKSPACE/.github/scripts/annotate.sh" "validate ${{ matrix.dir }}" terraform validate -no-color
        working-directory: ${{ matrix.dir }}

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint every chart
        run: |
          found=0
          for chart in $(find . -name Chart.yaml -printf '%h\n'); do
            found=1
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate.sh" "helm lint $chart" helm lint "$chart"
            bash "$GITHUB_WORKSPACE/.github/scripts/annotate.sh" "helm template $chart" helm template release "$chart"
          done
          echo "charts linted: $found"

  git-practice:
    name: git practice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the exercise end to end
        run: |
          cd 06-git-rebase
          bash solution.sh "$RUNNER_TEMP/git-solution"

  audit:
    name: audit scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The course code has no findings
        run: bash 07-audit/scan.sh .
      - name: The teaching fixture still has ten
        run: |
          set +e
          bash 07-audit/scan.sh 07-audit/examples | tail -1 | grep -x "10 findings."
